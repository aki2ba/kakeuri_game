/* =========================================================================
   汎用ユーティリティ
   ========================================================================= */
let S = null;                       // ゲーム状態（1スロット）
let rngState = 1;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let RNG = mulberry32(1);
function rnd(){ S.rngCount = (S.rngCount||0)+1; return RNG(); }
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function chance(p){ return rnd() < p; }
function rrange(pair){ return pair[0] + rnd()*(pair[1]-pair[0]); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function round0(v){ return Math.round(v); }

function fmt(v){ return Math.round(v).toLocaleString('ja-JP'); }
function man(v){ return fmt(v) + '万円'; }
function pct(v,d){ return (v*100).toFixed(d===undefined?1:d) + '%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ym(turn){
  const m0 = (CFG.startMonth - 1) + (turn - 1);
  return (CFG.startYear + Math.floor(m0/12)) + '年' + (m0%12 + 1) + '月';
}

/* =========================================================================
   §4.1 支払サイト（ガード条件を式より先に判定する）
   ========================================================================= */
function termsValid(t){
  if (t.mo === 0 && t.day <= t.closing) return false;   // 締める前には払えない
  return true;
}
function siteDays(t){
  if (!termsValid(t)) return null;
  if (t.mo === 0) return t.day - t.closing;
  return (30 - t.closing) + t.mo*30 + t.day;
}
function siteFormula(t){
  if (t.mo === 0) return `${t.day} − ${t.closing} = ${siteDays(t)}日`;
  return `(30−${t.closing}) + (${t.mo}×30) + ${t.day} = ${siteDays(t)}日`;
}
function termsLabel(t){
  const c = t.closing === 30 ? '末' : t.closing + '日';
  const m = ['当月','翌月','翌々月','3ヶ月後','4ヶ月後'][t.mo] || (t.mo + 'ヶ月後');
  const d = t.day === 30 ? '末' : t.day + '日';
  const method = { cash:'現金', note:'手形', partial:'一部手形' }[t.method];
  return `${c}締め ${m}${d}払い／${method}` + (t.method!=='cash' ? `（手形サイト${t.noteDays}日）` : '');
}
/** 売掛期間（月） */
function arMonths(t){ return siteDays(t) / 30; }
/** §6.4 実効サイト（月）＝ 売掛期間 + 手形回収割合 × 手形期間 */
function effectiveMonths(t){ return arMonths(t) + (t.noteRatio||0) * ((t.noteDays||0)/30); }
/** 売掛金の入金ターン（1ヶ月＝30日で丸める） */
function dueOffset(t){ return Math.max(1, Math.round(siteDays(t)/30)); }
function noteOffset(t){ return Math.max(1, Math.round((t.noteDays||0)/30)); }

/* =========================================================================
   §4.4 格付・与信枠
   ========================================================================= */
function ratingOf(co){
  if (co.score === null || co.score === undefined) return CFG.noRating;
  for (const r of CFG.ratings) if (co.score >= r.min) return r;
  return CFG.ratings[CFG.ratings.length-1];
}
function totalFrame(){ return Math.round(S.equity * CFG.frameMultiple); }
function frameUsed(){ return S.companies.filter(c=>c.active).reduce((a,c)=>a+c.limit, 0); }
function frameFree(){ return totalFrame() - frameUsed(); }
function perCompanyCap(co){ return Math.round(totalFrame() * ratingOf(co).pct); }
/** 必要限度（§4.4） */
function requiredLimit(co){
  const t = co.terms;
  return co.order * arMonths(t) + co.order * (t.noteRatio||0) * ((t.noteDays||0)/30);
}
function outstanding(co){
  return S.receivables.filter(r=>r.coId===co.id && !r.settled).reduce((a,r)=>a+r.amount,0);
}
function overdueAmount(co){
  return S.receivables.filter(r=>r.coId===co.id && !r.settled && r.dueTurn <= S.turn && r.kind==='ar').reduce((a,r)=>a+r.amount,0);
}
/** §9.2 枠の遊び = 限度額 − 直近3ヶ月の最大残高 */
function frameSlack(co){
  const peak = Math.max(outstanding(co), ...(co.balHistory||[0]).slice(-3));
  return Math.max(0, co.limit - peak);
}
/** §6.4 月次の出荷可能額 */
function shippableCash(co, limit){ return limit / arMonths(co.terms); }
function shippableReal(co, limit){ return limit / effectiveMonths(co.terms); }

/* =========================================================================
   会社レコード
   ========================================================================= */
let _cid = 0;
function makeCompany(o){
  const ind = INDUSTRIES[o.industry];
  const co = {
    id: ++_cid,
    name: o.name,
    industry: o.industry,
    order: o.order,                     // 月あたりの取引額
    baseOrder: o.order,
    terms: JSON.parse(JSON.stringify(o.terms || ind.terms)),
    score: (o.score === undefined) ? null : o.score,
    disclosed: o.score !== null && o.score !== undefined,
    limit: o.limit || 0,
    priceIdx: 1.0,                      // §6.9(h) 取引先ごとの粗利率はここから計算する
    room: o.room,                       // §6.3 交渉余地（隠しパラメータ）
    roomLower: null, roomRange: null,   // 調査で分かる範囲
    safeguards: {},                     // key -> {turn, pt}
    guarantorCap: null,
    isSupplier: false, apBalance: 0,
    status: 'normal',                   // normal / delay / longdelay / legal / closed
    delayTurns: 0, legalTurn: null, resolveTurn: null,
    termsChanged: false,
    recoveryBonus: 0, actionsTaken: {}, actionTurns: {},
    stock: null,                        // 納品物 {amount, resaleTurn}
    trap: o.trap || null,               // 'fraud' | 'circular' | 'antisocial' | 'note' | null
    suspicious: !!o.suspicious,         // 「怪しいが本物」
    registryChecked: false, creditChecked: false,
    active: true, startTurn: S ? S.turn : 1,
    balHistory: [], noPaperNote: false, jumpCount: 0,
    scoreCleanTurns: 0, note: o.note || '',
  };
  return co;
}
function randName(){
  for (let i=0;i<40;i++){
    const n = pick(PREFIX) + pick(NAME_A) + pick(NAME_B);
    if (!S.companies.some(c=>c.name===n) && !S.leads.some(c=>c.name===n)) return n;
  }
  return pick(PREFIX) + pick(NAME_A) + pick(NAME_B) + ri(2,99);
}
/** §6.9(e) 交渉余地の初期値 */
function initialRoom(score){
  if (score === null) return ri(2,3);
  if (score >= 62) return ri(1,2);
  if (score >= 46) return 2;
  return ri(2,3);
}
/** 現在の交渉余地（§6.3 余地は時間とともに縮む） */
function currentRoom(co, atContract){
  if (co.status === 'delay' || co.status === 'longdelay' || co.status === 'legal') return 0;
  let r = atContract ? co.room : co.room - 1;
  if (co.scoreDropped) r = Math.min(r, 1);
  r -= (S.reputationPenalty || 0);
  return Math.max(0, r);
}

  { name:'みなと水産株式会社', industry:'retail', order:520,  score:65, limit:1200, room:2, ar:1040 },
  { name:'山手フーズ株式会社', industry:'food',   order:520,  score:63, limit:1200, room:2, ar:1040 },
  { name:'三葉フーズ株式会社', industry:'retail', order:520,  score:64, limit:1200, room:2, ar:1040 },
];

function newGame(seed){
  _cid = 0;
  seed = seed || (Date.now() % 1000000);
  RNG = mulberry32(seed);
  S = {
    seed, rngCount:0, turn:1, phase:'play',
    cash: CFG.init.cash, equity: CFG.init.equity, fixedCost: CFG.init.fixedCost,
    employees: 0, inventory: 0, costIdx: 1.0,
    purchasePolicy:'standard', supplierMode:'normal',
    companies:[], leads:[], receivables:[], payables:[], loans:[],
    slotsUsed:0, log:[], cards:{}, newCards:[],
    pending:[],                       // 対応が必要な案件（イベント由来）
    yearOp:0, yearBadDebtWriteOff:0, yearSales:0,
    stats:{ sales:0, badDebtNet:0, badDebtGross:0, recovered:0, refused:0, refusedCount:0,
            avoidedLoss:0, refusedHealthy:0, safeguardsTaken:0, safeguardMissed:0,
            frameUseSum:0, frameUseCnt:0, actionsUsed:{}, cardsAt:{} },
    flags:{ toriteki:false, paperNoteEnd:false, legacySafe:false, legacyResolved:false },
    unlockedAt:{},                    // §11 機能の開放ターンの記録
    history:[], resolutions:[], ending:null, gameOver:null,
    reputationPenalty:0, legacy:{ amount:430, deadline:14, alive:true },
    surveys:[],                       // §6.3 調査は翌ターンに結果が出る
    trapPlan:[], eventsDone:{}, lastReport:null, cardQueue:[],
  };
  // 初期6社（§2.3）
  for (const d of INITIAL_COMPANIES){
    const co = makeCompany(d);
    co.limit = d.limit; co.main = !!d.main; co.startTurn = 0;
    S.companies.push(co);
    // 期首の売掛残高（月商×2ヶ月相当）を、直近2ヶ月に発生したものとして積む
    const off = dueOffset(co.terms);
    const half = d.ar/2;
    S.receivables.push({ id:'i'+co.id+'a', coId:co.id, amount:half, kind:'ar', dueTurn:1, born:-1, settled:false });
    S.receivables.push({ id:'i'+co.id+'b', coId:co.id, amount:d.ar-half, kind:'ar', dueTurn:1+Math.max(1,off-1), born:0, settled:false });
  }
  // 期首の買掛（前月仕入分）
  S.payables.push({ turn:1, amount: Math.round(4000*CFG.cogsRate) });
  planTraps();
  log('あなたは株式会社カケウリ商事の二代目社長に就任した。36ヶ月で会社を潰さず、焦げ付きを出さないことが目標である。','info');
  fireFixedEvents();
  generateLeads();
  return S;
}

function log(text, kind){
  S.log.unshift({ turn:S.turn, text, kind: kind||'' });
  if (S.log.length > 400) S.log.pop();
}

/* =========================================================================
   §7.3 罠プールと抽選
   ========================================================================= */
function planTraps(){
  const pool = ['fraud','circular','antisocial','notedrawer'];
  // 2〜3種を抽選
  const n = ri(2,3);
  const chosen = [];
  const p = pool.slice();
  for (let i=0;i<n;i++) chosen.push(p.splice(Math.floor(rnd()*p.length),1)[0]);
  const windows = { fraud:{intro:7, main:21}, circular:{intro:13, main:13},
                    antisocial:{intro:11, main:11}, notedrawer:{intro:17, main:22} };
  S.trapPlan = chosen.map(k=>({
    kind:k,
    introTurn: clamp(windows[k].intro + ri(-4,4), 2, 30),
    mainTurn:  clamp(windows[k].main  + ri(-4,4), 6, 32),
    done:false, introduced:false, coId:null, taken:false,
  }));
  S.trapPlan.forEach(t=>{ if (t.mainTurn <= t.introTurn) t.mainTurn = t.introTurn + ri(4,8); });
}

/* =========================================================================
   §8 解説カード
   ========================================================================= */
function giveCard(id){
  if (S.cards[id]) return;
  const c = CARDS.find(x=>x.id===id);
  if (!c) return;
  S.cards[id] = S.turn;
  S.stats.cardsAt[id] = S.turn;
  if (c.tier === '必須') S.cardQueue.push(id);
  else log('用語帳に追加: 「' + c.title + '」', 'card');
}
function cardCount(){ return Object.keys(S.cards).length; }

/* =========================================================================
   §3.3① 引合いフェーズ
   ========================================================================= */
function leadCount(){
  const shift = S.employees;            // §6.9(g) 従業員1人で期待値+0.5社
  let r = rnd(), acc = 0, n = 0;
  for (let i=0;i<CFG.leadDist.length;i++){ acc += CFG.leadDist[i]; if (r < acc){ n = i; break; } }
  if (shift > 0 && chance(Math.min(0.9, shift*0.5))) n += 1;
  return Math.min(3, n);
}
function generateLeads(){
  S.leads = [];
  const n = leadCount();
  for (let i=0;i<n;i++) S.leads.push(makeLead());
  // 「怪しいが本物」を毎回1〜2社混ぜる（§7.3）
  if (S.leads.length && chance(0.25)) { S.leads[0].suspicious = true; S.leads[0].registryFlags = registryFlagText(true); }
}
function makeLead(opt){
  opt = opt || {};
  const key = opt.industry || pick(Object.keys(INDUSTRIES));
  const ind = INDUSTRIES[key];
  const order = opt.order || ri(ind.min, ind.max);
  // §4.6 約3割は決算書を出さない → スコアなし
  const noScore = opt.score === null ? true : (opt.score === undefined ? chance(key==='ec'?0.5:0.3) : false);
  const score = opt.score !== undefined ? opt.score : (noScore ? null : ri(38,75));
  const co = makeCompany({
    name: opt.name || randName(), industry:key, order,
    terms: opt.terms || JSON.parse(JSON.stringify(ind.terms)),
    score, room: opt.room !== undefined ? opt.room : initialRoom(score),
    trap: opt.trap || null, note: opt.note || '',
  });
  co.isLead = true;
  co.registryFlags = registryFlagText(!!opt.trap || !!opt.suspicious);
  co.suspicious = !!opt.suspicious;
  co.creditNote = opt.creditNote || '';
  return co;
}
function registryFlagText(flagged){
  if (!flagged) return ['事業目的は食品関連に整合','本店の移転歴なし','役員の変更は直近3年なし'];
  return pick([
    ['事業目的に相互に無関係な事業が9件並ぶ','本店が2年で3回移転している','役員が昨年まとめて入れ替わっている'],
    ['設立は1998年だが商号を2年前に変更','本店移転が直近で2回','事業目的に「金融業」「古物商」など雑多な記載'],
  ]);
}

/* =========================================================================
   §3.5 機能の段階的開放（開放ターンを記録する。§11 の実装制約）
   ========================================================================= */
function unlocked(key){ return S.turn >= CFG.unlock[key]; }
function unlockTurn(key){ return CFG.unlock[key]; }
function safeguardAvailable(sg, turn){
  const t = (turn === undefined) ? S.turn : turn;
  return t >= (sg.tier === 'light' ? CFG.unlock.safeguardLight : CFG.unlock.safeguardHeavy);
}

/* =========================================================================
   ③ 出荷・売上計上フェーズ
   ========================================================================= */
const STOCK_LIFE = { retail:1, food:1, const:3, mfg:2, ec:2, medical:1 };

function marginOf(co){ return 1 - (CFG.cogsRate * S.costIdx / co.priceIdx); }

function phaseShip(rep){
  for (const co of S.companies){
    if (!co.active || co.status !== 'normal') continue;
    const head = Math.max(0, co.limit - outstanding(co));
    const ship = Math.min(co.order, head);
    co.balHistory.push(outstanding(co));
    if (co.balHistory.length > 6) co.balHistory.shift();
    if (ship <= 0.5){
      if (co.order > 0 && head < co.order) rep.blocked.push({ name:co.name, lost: co.order - Math.max(0,head) });
      continue;
    }
    if (ship < co.order - 0.5) rep.blocked.push({ name:co.name, lost: co.order - ship });
    const rev = ship;
    S.receivables.push({ id:'r'+(S.receivables.length+1), coId:co.id, amount:rev, kind:'ar',
                         dueTurn: S.turn + dueOffset(co.terms), born:S.turn, settled:false });
    co.stock = { amount: rev, deliveredTurn: S.turn, resaleTurn: S.turn + (STOCK_LIFE[co.industry]||1) };
    rep.sales += rev;
    const mg = marginOf(co);
    rep.gross += rev * mg;
    rep.cogs  += rev * (1 - mg);      // 実際に支払う仕入原価。価格転嫁の成否がそのまま現金に効く
  }
  S.stats.sales += rep.sales;
  S.yearSales += rep.sales;
}

/* =========================================================================
   ④ 入金フェーズ ＋ §6.9(a) 遅延の発生
   ========================================================================= */
function delayProb(co){
  if (co.neverDelay) return 0;          // §4.9 助走期間は一度も遅延しない
  const ind = INDUSTRIES[co.industry];
  return ind.delay * ratingOf(co).coef * (co.termsChanged ? 1.5 : 1);
}
function settleAR(co, r, rep){
  r.settled = true;
  const nr = (S.flags.paperNoteEnd && !co.keepsNote) ? 0 : (co.terms.noteRatio || 0);
  const cashPart = r.amount * (1 - nr);
  S.cash += cashPart; rep.cashIn += cashPart;
  if (nr > 0){
    const amt = r.amount * nr;
    S.receivables.push({ id:r.id+'n', coId:co.id, amount:amt, kind:'note', dueTurn:S.turn,
                         cashTurn: S.turn + noteOffset(co.terms), born:r.born, settled:false });
    rep.notes += amt;
  }
}
function phaseCollect(rep){
  for (const co of S.companies){
    if (!co.active) continue;
    const dues = S.receivables.filter(r=>r.coId===co.id && !r.settled && r.kind==='ar' && r.dueTurn <= S.turn);
    if (co.status === 'normal'){
      if (dues.length){
        if (chance(delayProb(co))){
          enterDelay(co, rep);
        } else {
          dues.forEach(r=>settleAR(co, r, rep));
          co.scoreCleanTurns++;
          if (co.scoreCleanTurns === 24 && co.score !== null){ co.score = Math.min(75, co.score+3); log(co.name+': 24ヶ月間 遅延なく取引を継続。信用スコアが +3 された。','good'); }
        }
      }
      // 手形の期日到来
      for (const r of S.receivables){
        if (r.coId===co.id && !r.settled && r.kind==='note' && r.cashTurn <= S.turn){
          r.settled = true; S.cash += r.amount; rep.cashIn += r.amount; rep.notesCashed += r.amount;
        }
      }
    }
  }
}
function enterDelay(co, rep){
  co.status = 'delay'; co.delayTurns = 1;
  if (co.score !== null) co.score = Math.max(0, co.score - 5);   // §6.9(d)
  log('⚠ ' + co.name + ' が支払期日に入金しなかった（遅延）。売掛 ' + man(outstanding(co)) + '。交渉余地は0になった。','bad');
  if (rep) rep.newDelays.push(co.name);
  giveCard('dunning-vs-demand');
}

/* =========================================================================
   §6.9(b) 遅延 → 長期遅延 → 法的整理（各ターン開始時に判定）
   ========================================================================= */
function phaseTransitions(){
  for (const co of S.companies){
    if (!co.active) continue;
    const T = CFG.transition;
    if (co.status === 'delay'){
      const bonus = (co.actionsTaken.dun || co.actionsTaken.mail) ? T.dunningBonus : 0;
      if (chance(T.delayToPaid + bonus)){
        payoffAll(co, '遅延が解消し、滞留していた売掛金が入金された');
      } else {
        co.status = 'longdelay'; co.delayTurns = 2;
        if (co.score !== null) co.score = Math.max(0, co.score - 12);
        log('⚠⚠ ' + co.name + ' が長期遅延に移行した。先取特権と相殺は時間との勝負になる。','bad');
        giveCard('movables-lien');
      }
    } else if (co.status === 'longdelay'){
      co.delayTurns++;
      const legalP = co.actionsTaken.plan ? T.longToLegalWithPlan : T.longToLegal;
      const payBonus = (co.actionsTaken.mail || co.actionsTaken.seizure) ? T.dunningBonus : 0;
      if (chance(legalP)) enterLegal(co, null);
      else if (chance(T.longToPaid + payBonus)) payoffAll(co, '長期遅延だったが、回収圧力が効いて全額が入金された');
    }
  }
}
function payoffAll(co, msg){
  let sum = 0;
  for (const r of S.receivables){
    if (r.coId===co.id && !r.settled){ r.settled = true; sum += r.amount; }
  }
  S.cash += sum;
  co.status = 'normal'; co.delayTurns = 0; co.actionsTaken = {};
  log('✔ ' + co.name + ': ' + msg + '（' + man(sum) + '）','good');
  S.pending = S.pending.filter(p=>p.coId !== co.id);
}
function enterLegal(co, forcedKind){
  const amt = outstanding(co);
  co.status = 'legal'; co.legalTurn = S.turn; co.resolveTurn = S.turn + 2;
  co.legalKind = forcedKind || (chance(0.70) ? '破産' : '民事再生');   // §5.8
  co.claim = amt;
  log('■ ' + co.name + ' が' + (co.legalKind==='破産'?'破産手続':'民事再生手続') +
      'に入った。個別の回収は止まり、売掛 ' + man(amt) + ' は配当を待つ立場になる。あと2ターンで結末が確定する。','bad');
  giveCard('bankruptcy-priority');
  S.pending.push({ coId:co.id, kind:'legal', text:'法的整理（配当確定まで2ターン）' });
}

/* =========================================================================
   §6.9(c) 回収の確定
   ========================================================================= */
function bestBase(co){
  // 相殺を先に確定 → 残額に対し、保全のうち最も高い基準回収率だけを適用（max。加算しない）
  const cand = [];
  if (co.trap === 'fraud' || co.trap === 'circular') return { key:'trap', rate:0, label:'この類型では回収手段が効かない' };
  cand.push({ key:'none', rate: rrange(CFG.baseRecovery.none), label:'保全なし' });
  if (co.safeguards.eol)       cand.push({ key:'eol', rate: rrange(CFG.baseRecovery.eol), label:'期限の利益喪失条項' });
  if (co.safeguards.retention) cand.push({ key:'retention', rate: rrange(CFG.baseRecovery.retention), label:'所有権留保' });
  if (co.safeguards.notarial)  cand.push({ key:'notarial', rate: rrange(CFG.baseRecovery.notarial), label:'公正証書（執行力あり）' });
  if (co.safeguards.guarantor && co.actionsTaken.claimGuarantor){
    if (co.guarantorCap && co.guarantorCap > 0) cand.push({ key:'guarantor', rate: rrange(CFG.baseRecovery.guarantor), label:'連帯保証人', cap: co.guarantorCap });
    else cand.push({ key:'guarantorVoid', rate:0, label:'連帯保証人（極度額の定めがなく無効）' });
  }
  if (co.safeguards.collateral && co.actionsTaken.enforceCollateral)
    cand.push({ key:'collateral', rate: rrange(CFG.baseRecovery.collateral), label:'物的担保' });
  cand.sort((a,b)=>b.rate-a.rate);
  return cand[0];
}
function resolveClaim(co){
  const total = co.claim;
  let recovered = 0;
  const lines = [];
  // 1) 相殺（買掛金の額まで100%）
  let offsetAmt = 0;
  if (co.actionsTaken.offset && co.isSupplier && co.apBalance > 0){
    offsetAmt = Math.min(total, co.apBalance);
    recovered += offsetAmt;
    lines.push('相殺で ' + man(offsetAmt) + ' を確保（買掛金の範囲は100%）');
  }
  const rest = total - offsetAmt;
  // 2) 基準回収率（最も高いもの1つだけ）
  const base = bestBase(co);
  let rate = base.rate;
  // 3) §6.7 のボーナスを加算し 100% でクリップ
  const bonus = co.recoveryBonus || 0;
  rate = clamp(rate + bonus, 0, 1);
  let got = rest * rate;
  if (base.cap) got = Math.min(got, base.cap);
  recovered += got;
  lines.push('基準回収率 ' + pct(base.rate,0) + '（' + base.label + '）＋ 回収アクション ' + pct(bonus,0) +
             ' → ' + pct(rate,0) + ' で ' + man(got));
  if (base.cap) lines.push('連帯保証人の極度額 ' + man(base.cap) + ' でキャップ');
  if (co.legalKind === '民事再生') lines.push('民事再生のため、残額は再生計画に従って大幅に減額された');

  const loss = total - recovered;
  S.cash += recovered;
  S.equity -= loss;                      // §6.9(f) 焦げ付きは確定時に自己資本から直接減らす
  S.stats.recovered += recovered;
  S.stats.badDebtGross += total;
  S.stats.badDebtNet += loss;
  S.receivables.forEach(r=>{ if (r.coId===co.id) r.settled = true; });
  co.status = 'closed'; co.active = false; co.order = 0;
  co.writeOffPending = loss;             // §5.14 貸倒計上の判断材料
  S.resolutions.push({ name:co.name, total, recovered, loss, base:base.label, bonus,
                       safeguards:Object.keys(co.safeguards), turn:S.turn, trap:co.trap });
  S.pending = S.pending.filter(p=>p.coId !== co.id);
  log('【確定】' + co.name + '：債権 ' + man(total) + ' のうち ' + man(recovered) + ' を回収、' +
      man(loss) + ' が焦げ付いた。' + lines.join(' / '), loss > recovered ? 'bad':'good');
  if (co.trap === 'fraud' || co.trap === 'circular') giveCard(co.trap==='fraud'?'torikomi':'circular');
  if (Object.keys(co.safeguards).length === 0) giveCard('safeguard-timing');
  return { recovered, loss, lines };
}
function resolveDueClaims(){
  for (const co of S.companies){
    if (co.status === 'legal' && S.turn >= co.resolveTurn) resolveClaim(co);
  }
}

/* =========================================================================
   ⑥ 月次コストフェーズ
   ========================================================================= */
function expectedSales(){
  return S.companies.filter(c=>c.active && c.status==='normal')
                    .reduce((a,c)=>a + (c.prepay ? c.order : Math.min(c.order, c.limit/effectiveMonths(c.terms))), 0);
}
function expectedCogs(){
  return S.companies.filter(c=>c.active && c.status==='normal')
                    .reduce((a,c)=>{ const v = c.prepay ? c.order : Math.min(c.order, c.limit/effectiveMonths(c.terms));
                                     return a + v * (1 - marginOf(c)); }, 0);
}
function phaseCosts(rep){
  // 仕入（前月発注分の支払）
  const dues = S.payables.filter(p=>p.turn <= S.turn);
  const buy = dues.reduce((a,p)=>a+p.amount,0);
  S.payables = S.payables.filter(p=>p.turn > S.turn);
  S.cash -= buy; rep.buy = buy;

  // 当月の発注（支払は翌月末）
  const pol = CFG.purchasePolicies[S.purchasePolicy];
  const sup = CFG.supplierModes[S.supplierMode];
  const cogs = rep.cogs;
  const target = expectedCogs() * (pol.mult - 1);
  const orderAmt = Math.max(0, cogs + (target - S.inventory)) * sup.priceMult;
  S.payables.push({ turn:S.turn+1, amount: orderAmt });
  S.inventory = Math.max(0, S.inventory + orderAmt/sup.priceMult - cogs);
  rep.purchaseOrder = orderAmt;
  // 相殺の盾: 売り先を兼ねる仕入先には買掛金が立つ
  if (S.supplierMode === 'cross'){
    const targets = S.companies.filter(c=>c.active && c.isSupplier);
    if (targets.length){
      const each = orderAmt / targets.length;
      targets.forEach(c=>{ c.apBalance = Math.min(c.limit, (c.apBalance||0)*0.6 + each); });
    }
  } else {
    S.companies.forEach(c=>{ if (c.apBalance) c.apBalance *= 0.6; });
  }

  const fixed = S.fixedCost + S.employees * CFG.employeeCost;
  S.cash -= fixed; rep.fixed = fixed;
  S.cash -= rep.expense;
  // 借入の返済
  let loanPay = 0;
  for (const l of S.loans){
    if (l.left <= 0) continue;
    const interest = l.left * l.rate/12;
    const principal = Math.min(l.left, l.monthly);
    loanPay += interest + principal; l.left -= principal;
  }
  S.loans = S.loans.filter(l=>l.left > 0.5);
  S.cash -= loanPay; rep.loanPay = loanPay;

  rep.op = rep.gross - fixed - rep.expense - loanPay;   // 営業利益（焦げ付きは含めない。§6.9(f)）
  S.yearOp += rep.op;
  S.equity += rep.op;
  rep.cashOut = buy + fixed + rep.expense + loanPay;

  if (S.cash < 0){
    S.gameOver = { turn:S.turn, kind: (S.yearOp >= 0 ? '黒字倒産' : '赤字倒産'), cash:S.cash };
    log('★ 現金が ' + man(S.cash) + ' となり、支払いができなくなった。' + S.gameOver.kind + 'である。','bad');
  }
}

/* =========================================================================
   ターン進行
   ========================================================================= */
function endTurn(){
  if (S.gameOver || S.ending) return;
  const rep = { turn:S.turn, sales:0, gross:0, cogs:0, cashIn:0, cashOut:0, notes:0, notesCashed:0,
                expense: S.turnExpense || 0, buy:0, fixed:0, loanPay:0, op:0,
                blocked:[], newDelays:[], events:[] };
  // 当月の入金を確認してから、その月の出荷を行う（§3.3③④。限度額 ÷ 実効サイト ＝ 月次出荷可能額 が
  // 正しく成り立つのは、期日到来分を落としてから与信枠の空きを見るときである）
  phaseCollect(rep);
  phaseShip(rep);
  phaseCosts(rep);
  if (S.gameOver){ S.lastReport = rep; return; }
  phaseRandomEvents(rep);
  resolveDueClaims();
  S.stats.frameUseSum += frameUsed()/Math.max(1,totalFrame()); S.stats.frameUseCnt++;
  S.history.push({ turn:S.turn, cash:S.cash, equity:S.equity, sales:rep.sales,
                   ar: S.receivables.filter(r=>!r.settled).reduce((a,r)=>a+r.amount,0) });
  S.lastReport = rep;
  if (CFG.closingTurns.includes(S.turn)) doClosing(rep);
  if (S.turn >= CFG.turns){ finishGame(); return; }
  // --- 次ターンへ ---
  S.turn++;
  S.turnExpense = 0; S.slotsUsed = 0;
  if (CFG.fixedCostStepTurns.includes(S.turn) && S.turn > 1){
    S.fixedCost += CFG.fixedCostStep;
    log('4月。人件費の改定で固定費が月 +' + CFG.fixedCostStep + '万円 になった（月 ' + man(S.fixedCost) + '）。','warn');
  }
  phaseTransitions();
  resolveDueClaims();
  resolveSurveys();
  tickLegacy();
  fireFixedEvents();
  fireTraps();
  generateLeads();
}

/* §6.3 調査は翌ターンに結果が出る */
function resolveSurveys(){
  const done = S.surveys.filter(s=>s.turn <= S.turn);
  S.surveys = S.surveys.filter(s=>s.turn > S.turn);
  for (const s of done){
    const co = findCo(s.coId);
    if (!co) continue;
    if (s.kind === 'registry'){
      co.registryChecked = true;
      co.roomLower = Math.max(1, co.room - 1);
      log('【調査結果】' + co.name + ' の登記: ' + co.registryFlags.join(' / ') + ' ／ 交渉余地は ' + co.roomLower + ' 以上','info');
      if (co.trap === 'fraud' || co.suspicious) giveCard('registry-flags');
    } else {
      co.creditChecked = true;
      co.roomRange = [Math.max(1,co.room-0), Math.min(4,co.room+1)];
      if (co.score === null) co.score = ri(38, 64);
      let extra = '';
      if (co.trap === 'fraud') extra = ' ★ 2年前に買収された休眠会社であることが判明した。';
      else if (co.trap === 'antisocial') extra = ' ★ 反社会的勢力との関係が確認された。取引してはならない。';
      else if (co.trap === 'circular') extra = ' ★ 紹介元の取引に商流の実体が確認できない。';
      else if (co.suspicious) extra = ' 登記に不自然さはあるが、実需のある堅実な会社である。';
      log('【調査結果】' + co.name + '：信用スコア ' + co.score + '（' + ratingOf(co).key + '）／交渉余地 ' +
          co.roomRange[0] + '〜' + co.roomRange[1] + '。' + extra, extra ? 'warn':'info');
      if (co.trap === 'antisocial') giveCard('illegal-liability');
      if (co.trap === 'fraud') giveCard('torikomi');
      if (co.trap === 'circular') giveCard('circular');
    }
  }
}
function findCo(id){ return S.companies.find(c=>c.id===id) || S.leads.find(c=>c.id===id); }

/* §5.2 先代からの放置債権 */
function tickLegacy(){
  const L = S.legacy;
  if (!L.alive) return;
  if (S.turn >= L.deadline && !S.flags.legacySafe){
    L.alive = false;
    S.equity -= L.amount;
    S.stats.badDebtGross += L.amount; S.stats.badDebtNet += L.amount;
    log('★ 先代が放置していた売掛金 ' + man(L.amount) + ' が消滅時効を迎えた。催告も債務承認も打たなかったため、法的に請求できなくなった。','bad');
    giveCard('prescription');
  }
}

/* =========================================================================
   §5.14 決算（第12・24・36ターン）
   ========================================================================= */
function doClosing(rep){
  const writeoffs = S.companies.filter(c=>c.writeOffPending > 0);
  S.pendingClosing = {
    turn:S.turn, op:S.yearOp, sales:S.yearSales,
    candidates: writeoffs.map(c=>({ id:c.id, name:c.name, amount:c.writeOffPending })),
  };
}
function applyClosing(selectedIds){
  const C = S.pendingClosing;
  let wo = 0;
  for (const id of selectedIds){
    const co = S.companies.find(c=>c.id===id);
    if (co){ wo += co.writeOffPending; co.writtenOff = true; co.writeOffPending = 0; }
  }
  const taxable = Math.max(0, C.op - wo);
  const tax = taxable * CFG.tax;
  S.cash -= tax; S.equity -= tax;
  log('【決算】営業利益 ' + man(C.op) + ' ／ 貸倒計上 ' + man(wo) + ' → 課税所得 ' + man(taxable) +
      '、納税 ' + man(tax) + ' を支払った。','info');
  giveCard('bad-debt-tax');
  S.yearOp = 0; S.yearSales = 0; S.pendingClosing = null;
  if (S.cash < 0){ S.gameOver = { turn:S.turn, kind:'納税による資金ショート', cash:S.cash }; }
}

function finishGame(){
  const net = S.stats.badDebtNet;
  const rate = net / Math.max(1, S.stats.sales);
  let grade;
  if (net <= CFG.win.excellentAmt && rate <= CFG.win.excellentRate) grade = { key:'優', title:'無事故経営' };
  else if (net <= CFG.win.goodAmt && rate <= CFG.win.goodRate) grade = { key:'良', title:'堅実経営' };
  else grade = { key:'生存', title:'36ターンを生き延びた' };
  S.ending = { grade, net, rate, cash:S.cash, equity:S.equity };
}

/* =========================================================================
   §6.3 交渉余地モデル（新規契約・追加交渉に共通）
   ========================================================================= */
function negotiate(co, sgKeys, concKeys, atContract){
  sgKeys = sgKeys.filter(k=>safeguardAvailable(CFG.safeguards.find(s=>s.key===k)));   // §3.5 未開放の保全は要求できない
  const room = currentRoom(co, atContract) + concKeys.length;
  const req = sgKeys.reduce((a,k)=>a + CFG.safeguards.find(s=>s.key===k).pt, 0);
  if (req <= room) return { ok:true, room, req };
  if (req === room + 1){
    // 1pt 超過 → 相手が代替案を出す（§6.3）
    const sorted = sgKeys.slice().sort((a,b)=>CFG.safeguards.find(s=>s.key===b).pt - CFG.safeguards.find(s=>s.key===a).pt);
    const drop = sorted[0];
    let counter = sgKeys.filter(k=>k!==drop);
    if (drop === 'notarial') counter.push('eol');
    if (drop === 'guarantor' || drop === 'collateral') counter.push('retention');
    counter = [...new Set(counter)];
    const cReq = counter.reduce((a,k)=>a + CFG.safeguards.find(s=>s.key===k).pt, 0);
    if (cReq <= room) return { ok:false, counter, room, req };
    return { ok:false, counter:[], room, req };
  }
  return { ok:false, lost:true, room, req };
}
function applyConcessions(co, concKeys){
  for (const k of concKeys){
    if (k === 'discount') co.priceIdx *= 0.99;
    if (k === 'site') co.terms.mo += 1;                 // 支払月を1ヶ月後ろへ（＝サイト30日延長）
    if (k === 'volume') co.order = Math.round(co.order * 0.8);
  }
  co.concessions = (co.concessions||[]).concat(concKeys);
}
function grantSafeguards(co, sgKeys){
  for (const k of sgKeys){
    const sg = CFG.safeguards.find(s=>s.key===k);
    co.safeguards[k] = { turn:S.turn, pt:sg.pt };
    S.stats.safeguardsTaken++;
  }
}

/** 引合いを受ける（掛売り） */
function acceptLead(co, limit, sgKeys, concKeys, guarantorCap){
  const res = negotiate(co, sgKeys, concKeys, true);
  if (res.lost || (!res.ok && (!res.counter || !res.counter.length))){
    log('✕ ' + co.name + ' との交渉は決裂した（要求 ' + res.req + 'pt に対し、相手の交渉余地は届かなかった）。','warn');
    S.leads = S.leads.filter(l=>l.id!==co.id);
    return { lost:true };
  }
  if (!res.ok) return { counter:res.counter };     // 対案 → UI で再提示
  sgKeys = sgKeys.filter(k=>safeguardAvailable(CFG.safeguards.find(s=>s.key===k)));
  applyConcessions(co, concKeys);
  grantSafeguards(co, sgKeys);
  if (sgKeys.includes('guarantor')) co.guarantorCap = guarantorCap || null;
  co.isLead = false; co.limit = limit; co.startTurn = S.turn; co.active = true;
  S.companies.push(co);
  S.leads = S.leads.filter(l=>l.id!==co.id);
  log('◎ ' + co.name + ' と掛取引を開始した。限度額 ' + man(limit) + '／保全 ' +
      (sgKeys.length ? sgKeys.map(k=>CFG.safeguards.find(s=>s.key===k).label).join('・') : 'なし') +
      (concKeys.length ? '／差し出したもの: ' + concKeys.map(k=>CFG.concessions.find(c=>c.key===k).label).join('・') : ''), 'good');
  if (!sgKeys.length && unlocked('safeguardLight')) S.stats.safeguardMissed++;
  if (sgKeys.includes('guarantor') && !guarantorCap) log('（連帯保証人の極度額は未入力のまま契約した）','');
  return { ok:true };
}
function requestCash(co){
  S.leads = S.leads.filter(l=>l.id!==co.id);
  if (chance(0.40)){
    log('✕ ' + co.name + ': 現金・前払いを要求したところ失注した（40%の失注リスク）。','warn');
    S.stats.refused += co.order; S.stats.refusedCount++;
    return false;
  }
  co.prepay = true; co.limit = 0; co.isLead = false; co.startTurn = S.turn;
  S.companies.push(co);
  log('◎ ' + co.name + ' と現金取引を開始した。リスクはゼロだが、相手が飲む条件は限られる。','good');
  return true;
}
function refuseLead(co){
  S.leads = S.leads.filter(l=>l.id!==co.id);
  S.stats.refused += co.order; S.stats.refusedCount++;
  // 裏で「断らなければどうなったか」を判定しておく（§8.4 回避した損失）
  if (co.trap) S.stats.avoidedLoss += co.order * 2;
  else if (chance(0.12)) S.stats.avoidedLoss += co.order * 1.5;
  else S.stats.refusedHealthy += co.order;
  log('― ' + co.name + ' の打診を断った（月 ' + man(co.order) + '）。','');
}

function inTrouble(co){ return ['delay','longdelay','legal'].includes(co.status); }
function stockAlive(co){ return co.stock && S.turn < co.stock.resaleTurn; }

/** 「いつまでなら取れたか」（§9.5・§3.5 の制約: 開放されていた機能しか挙げない） */
function couldHaveSafeguard(co, key){
  const sg = CFG.safeguards.find(s=>s.key===key);
  const unlockT = sg.tier === 'light' ? CFG.unlock.safeguardLight : CFG.unlock.safeguardHeavy;
  const start = co.startTurn || 1;
  const out = [];
  if (start >= unlockT) out.push('第' + start + 'ターンの契約時なら ' + sg.pt + 'pt で取れました');
  else out.push('契約した第' + start + 'ターンにはこの手段をまだ扱えませんでした（第' + unlockT + 'ターンから）');
  const win = Math.max(start, unlockT);
  if (co.scoreDropTurn && co.scoreDropTurn > win) out.push('第' + win + '〜' + (co.scoreDropTurn-1) + 'ターンなら「保全条件を追加交渉する」で取れました（交渉余地 ' + Math.max(0,co.room-1) + '）');
  else if (co.delayStartTurn && co.delayStartTurn > win) out.push('第' + win + '〜' + (co.delayStartTurn-1) + 'ターンなら「保全条件を追加交渉する」で取れました');
  out.push('現在は交渉余地 ' + currentRoom(co,false) + ' で、取れません');
  return out;
}

function spend(amount){ S.turnExpense = (S.turnExpense||0) + amount; }

function runCollectAction(coId, key){
  const co = findCo(coId); const a = COLLECT_ACTIONS.find(x=>x.key===key);
  if (!co || !a || !a.ok(co) || slotsLeft() <= 0) return false;
  useSlot(); spend(a.cost); a.run(co);
  S.stats.actionsUsed[key] = (S.stats.actionsUsed[key]||0) + 1;
  return true;
}
function runSurvey(coId, kind){
  if (slotsLeft() <= 0) return false;
  const co = findCo(coId); if (!co) return false;
  useSlot(); spend(kind === 'registry' ? CFG.cost.registry : CFG.cost.credit);
  S.surveys.push({ coId, kind, turn:S.turn + 1 });
  S.stats.actionsUsed[kind] = (S.stats.actionsUsed[kind]||0) + 1;
  log(co.name + ' の' + (kind==='registry'?'登記を確認':'信用調査を依頼') + 'した。結果は翌ターンに出る。','info');
  return true;
}
function runOnsite(coId){
  if (slotsLeft() <= 0) return false;
  const co = findCo(coId); if (!co) return false;
  useSlot(); spend(CFG.cost.onsite);
  if (co.trap === 'circular'){
    co.exposed = true;
    log('★ ' + co.name + ' の倉庫を訪ねた。伝票上は毎月動いているはずの商品が、一度も動いていない。架空循環取引である。','bad');
    giveCard('circular');
  } else {
    log(co.name + ' の現物を確認した。商品は実際に動いており、取引に実体がある。','good');
  }
  return true;
}
function runPassthru(coId){
  if (slotsLeft() <= 0) return false;
  const co = findCo(coId); if (!co) return false;
  useSlot();
  if (chance(0.6)){
    co.priceIdx = Math.min(co.priceIdx * 1.15, S.costIdx);
    log('◎ ' + co.name + ' との価格転嫁交渉が成立した。この取引先の粗利率は ' + pct(marginOf(co)) + ' に戻った。','good');
  } else {
    co.order = Math.round(co.order * 0.90);
    log('✕ ' + co.name + ' との価格転嫁交渉は決裂し、発注が10%減った。','warn');
  }
  return true;
}
/** 全取引先への価格改定の通告（1枠）。まとめて転嫁できるが、飲まない相手は発注を減らす */
function runBulkPrice(){
  if (slotsLeft() <= 0) return false;
  useSlot();
  let ok = 0, ng = 0;
  for (const co of S.companies){
    if (!co.active || co.status !== 'normal') continue;
    if (chance(0.7)){ co.priceIdx = S.costIdx; ok++; }
    else { co.order = Math.round(co.order * 0.95); ng++; }
  }
  log('全取引先に価格改定を通告した。' + ok + '社が受け入れ、' + ng + '社が発注を10%減らした。','warn');
  return true;
}

function runDenki(coId){
  if (slotsLeft() <= 0) return false;
  const co = findCo(coId); if (!co) return false;
  useSlot();
  if (chance(0.7)){
    co.refusesDenki = false; co.denkiDeadline = null;
    log('◎ ' + co.name + ' は電子記録債権（でんさい）への移行に応じた。取引を続けられる。','good');
  } else {
    log('✕ ' + co.name + ' は紙での支払に固執している。次のターンまでに合意できなければ取引は止まる。','warn');
  }
  giveCard('note-abolition');
  return true;
}
function runRenego(coId, sgKeys, concKeys, guarantorCap){
  const co = findCo(coId); if (!co || slotsLeft() <= 0) return { fail:true };
  const res = negotiate(co, sgKeys, concKeys, false);
  useSlot();
  if (!res.ok){
    log('✕ ' + co.name + ' との保全条件の追加交渉は決裂した（要求 ' + res.req + 'pt ／ 調整後の余地 ' + res.room + '）。','warn');
    return { lost:true };
  }
  sgKeys = sgKeys.filter(k=>safeguardAvailable(CFG.safeguards.find(s=>s.key===k)));
  applyConcessions(co, concKeys);
  grantSafeguards(co, sgKeys);
  if (sgKeys.includes('guarantor')) co.guarantorCap = guarantorCap || null;
  log('◎ ' + co.name + ' から ' + sgKeys.map(sgLabel).join('・') + ' を取得した' +
      (concKeys.length ? '（差し出したもの: ' + concKeys.map(k=>CFG.concessions.find(c=>c.key===k).label).join('・') + '）':'') + '。','good');
  giveCard('safeguard-timing');
  return { ok:true };
}

/* §6.8 資金の手当て */
function factorableList(){
  return S.receivables.filter(r=>{
    const co = findCo(r.coId);
    return !r.settled && r.kind==='ar' && co && co.status==='normal';
  });
}
function factoringFee(r){
  const remain = Math.max(0, r.dueTurn - S.turn);
  return clamp(0.15 - 0.045*remain, 0.05, 0.15);
}
function runFactoring(rid){
  const r = S.receivables.find(x=>x.id===rid); if (!r || slotsLeft()<=0) return false;
  const fee = factoringFee(r); const cashGot = r.amount * (1-fee);
  useSlot(); r.settled = true; r.factored = true;
  S.cash += cashGot; S.equity -= r.amount * fee;
  log('ファクタリングで売掛 ' + man(r.amount) + ' を譲渡し、手数料 ' + pct(fee,0) + '（' + man(r.amount*fee) +
      '）を引いた ' + man(cashGot) + ' を受け取った。これは借入ではなく債権の売買である。','warn');
  giveCard('factoring');
  return true;
}
function runDiscountNote(rid){
  const r = S.receivables.find(x=>x.id===rid); if (!r || slotsLeft()<=0) return false;
  const remain = Math.max(0, r.cashTurn - S.turn);
  const fee = 0.005 + 0.01*remain;
  useSlot(); r.settled = true;
  S.cash += r.amount*(1-fee); S.equity -= r.amount*fee;
  log('手形 ' + man(r.amount) + ' を割り引いた。割引料 ' + pct(fee,1) + '（' + man(r.amount*fee) + '）。','warn');
  giveCard('note-not-cash');
  return true;
}
function runLoan(amount){
  if (slotsLeft()<=0) return false;
  useSlot();
  S.loans.push({ left:amount, rate:0.03, monthly: amount/24 });
  S.cash += amount;
  log('銀行から ' + man(amount) + ' を借り入れた。返済（24回）と利息が毎月の固定的な負担になる。','warn');
  return true;
}
function runHire(){
  if (slotsLeft()<=0) return false;
  useSlot(); S.employees++;
  log('人を1人増やした。アクション枠が ' + slotsTotal() + ' に、引合いも増える。固定費は月 +' + CFG.employeeCost + '万円。','info');
  return true;
}
function toggleSupplier(coId){
  const co = findCo(coId); if (!co) return;
  co.isSupplier = !co.isSupplier;
  log(co.name + ' を仕入先に' + (co.isSupplier?'指定した（仕入価格は3%高くなるが、焦げたとき相殺できる）':'指定するのをやめた') + '。','info');
  giveCard('supplier-choice');
}
function setLimit(coId, v){
  const co = findCo(coId); if (!co) return { ok:false };
  const cap = perCompanyCap(co);
  const others = frameUsed() - co.limit;
  if (v > co.limit){
    if (co.limit > cap) return { ok:false, msg:'この取引先は既に格付上限を超えています（経過措置）。増額はできません。' };
    if (v > cap) return { ok:false, msg:'格付「' + ratingOf(co).key + '」の1社上限 ' + man(cap) + ' を超えています。' };
    if (others + v > totalFrame()) return { ok:false, msg:'総与信枠 ' + man(totalFrame()) + ' を超えます。他社の限度額を減らして枠を空けてください。' };
  }
  co.limit = v;
  return { ok:true };
}

/* ---- 固定イベント（§7.1） ---- */
function fireFixedEvents(){
  const t = S.turn;
  const once = (k)=>{ if (S.eventsDone[k]) return false; S.eventsDone[k] = t; return true; };

  if (t === 1 && once('intro')) queuePrompt('intro');

  if (t === 3 && once('t3big')){
    S.leads.push(makeLead({ name:'株式会社サンフレッシュ関東', industry:'retail', order:800, score:66,
                            terms:{closing:30,mo:1,day:30,method:'cash',noteRatio:0,noteDays:0} }));
    queuePrompt('t3big');
  }
  if (t === 5 && once('t5note')){
    const lead = makeLead({ name:'株式会社ミヤマ建工', industry:'const', order:600, score:58,
                            terms:{closing:30,mo:1,day:30,method:'note',noteRatio:1.0,noteDays:120} });
    lead.longNote = true;
    S.leads.push(lead);
    S.unlockedAt.safeguardLight = t;
    queuePrompt('t5note');
  }
  if (t === 6 && once('t6delay')){
    S.unlockedAt.collection = t;
    const co = pickCo(c=>!c.main) || pickCo();
    if (co){ enterDelay(co, null); queuePrompt('t6delay', { name: co.name }); }
  }
  if (t === 8 && once('t8out')){ S.unlockedAt.safeguardHeavy = t; queuePrompt('t8outsource'); }
  if (t === 9 && once('t9key')){
    const co = makeLead({ name:'丸源建設株式会社', industry:'const', order:480, score:57, room:2,
                          terms:{closing:30,mo:2,day:30,method:'note',noteRatio:1.0,noteDays:60} });
    co.key9 = true;
    co.note = '保全がすべて開放された最初のターンの契約。ここで何を取ったかが第18ターンの答え合わせになる。';
    S.leads.push(co);
    log('【重要】丸源建設からの引合い。保全条件がすべて開放された最初のターンである。','warn');
  }
  if (t === 10 && once('t10')) queuePrompt('t10law');
  if (t === 11 && once('t11')) queuePrompt('t11rebate');
  if (t === 12 && once('t12')){ S.unlockedAt.finance = t; log('決算期。ファクタリング・手形割引・借入が使えるようになった。','info'); }
  if (t === 15 && once('t15')){ raiseCost(0.10, '仕入価格が高騰した'); queuePrompt('t15cost'); }
  if (t === 16 && once('t16')){
    const co = S.companies.find(c=>c.key9 && c.active && c.status==='normal');
    if (co){ enterDelay(co, null); co.delayStartTurn = t; }
  }
  if (t === 18 && once('t18')){
    const co = S.companies.find(c=>c.key9 && c.active);
    if (co && co.status !== 'closed'){
      co.status = 'longdelay'; co.delayTurns = 2; if (co.score!==null) co.score = Math.max(0, co.score-12);
      co.stock = co.stock || { amount: co.order, deliveredTurn:t-2, resaleTurn: t-1 };
      log('⚠⚠ 丸源建設が長期遅延に。第9ターンの契約で何を取ったかで、いま打てる手が変わる。回収画面を開くこと。','bad');
      queuePrompt('t18long', { coId: co.id });
    }
  }
  if (t === 20 && once('t20')){
    const co = mainCo();
    if (co){ co.score = 48; co.scoreDropped = true; co.scoreDropTurn = t;
      queuePrompt('t20drop', { name: co.name }); }
  }
  if (t === 22 && once('t22')) queuePrompt('t22bank');
  if (t === 23 && once('t23')){
    const co = pickCo(c=>Object.keys(c.safeguards).length===0 && !c.main) || pickCo(c=>!c.main);
    if (co) queuePrompt('jump', { coId: co.id });
  }
  if (t === 24 && once('t24')) queuePrompt('t24paper');
  if (t === 26 && once('t26')){
    const key = pick(Object.keys(INDUSTRIES));
    S.companies.forEach(c=>{ if (c.industry===key && c.active) c.order = Math.round(c.order*0.8); });
    queuePrompt('t26market', { label: INDUSTRIES[key].label });
  }
  if (t === 27 && once('t27')){
    const co = pickCo(c=>!c.main);
    if (co){
      co.stock = { amount: Math.max(co.order, 200), deliveredTurn:t, resaleTurn: t+1 };
      S.receivables.push({ id:'r27', coId:co.id, amount:co.stock.amount, kind:'ar', dueTurn:t+2, born:t, settled:false });
      enterLegal(co, '事業停止');
      queuePrompt('t27stop', { coId: co.id });
    }
  }
  if (t === 28 && once('t28')){
    const co = mainCo();
    if (co && co.status === 'normal'){ enterDelay(co, null); co.delayStartTurn = t; co.status = 'longdelay'; co.delayTurns = 2;
      log('⚠⚠ 主要取引先が長期遅延に入った。交渉余地は0になり、もう何も取れない。','bad'); }
  }
  if (t === 30 && once('t30')){
    const co = mainCo();
    if (co && co.status !== 'closed' && co.active){
      enterLegal(co, null);
      queuePrompt('t30legal', { coId: co.id, kind: co.legalKind, amount: co.claim });
    }
  }
  if (t === 31 && once('t31')){
    const co = pickCo(c=>Object.keys(c.safeguards).length>0);
    if (co) queuePrompt('jump', { coId: co.id });
  }
  if (t === 32 && once('t32')) raiseCost(0.08, '仕入価格の上昇がピークに達した');
  if (t === 34 && once('t34')){
    S.leads.push(makeLead({ name:'株式会社北関東マテリアル', industry:'mfg', order:640, score:61 }));
    queuePrompt('t34last');
  }
}

/* ---- 罠（§7.3） ---- */
function fireTraps(){
  for (const tp of S.trapPlan){
    if (!tp.introduced && S.turn === tp.introTurn){
      tp.introduced = true;
      if (tp.kind === 'fraud'){
        const co = makeLead({ name:'株式会社ミツバ物流サービス', industry:'retail', order:40, score:50, trap:'fraud', room:3 });
        co.neverDelay = true;
        S.leads.push(co); tp.coId = co.id;
        log('小口（月40万円）の新規の引合いがあった。','');
      } else if (tp.kind === 'antisocial'){
        const co = makeLead({ name:'株式会社アカツキ商会', industry:'retail', order:600, score:68, trap:'antisocial', room:3,
                              terms:{closing:10,mo:0,day:30,method:'cash',noteRatio:0,noteDays:0} });
        co.neverDelay = true;
        S.leads.push(co); tp.coId = co.id;
        log('条件が非常に良い引合いがあった（月600万円・10日締め当月末払い＝20日サイト）。話がうますぎるほど良い。','');
      } else if (tp.kind === 'notedrawer'){
        const co = S.companies.find(c=>c.active && (c.terms.noteRatio||0) > 0);
        if (co) tp.coId = co.id; else tp.done = true;
      }
    }
    if (!tp.done && tp.introduced && S.turn === tp.mainTurn){
      if (tp.kind === 'fraud'){
        const co = S.companies.find(c=>c.id===tp.coId && c.active);
        if (co){ co.order = 2000; co.wantsLimit = 2000;
          co.terms = { closing:30, mo:2, day:30, method:'cash', noteRatio:0, noteDays:0 };
          queuePrompt('fraudMain', { coId: co.id }); tp.done = true; tp.armed = true; tp.burstTurn = S.turn + 2; }
        else tp.done = true;
      } else if (tp.kind === 'circular'){
        queuePrompt('circularMain'); tp.done = true;
      } else if (tp.kind === 'antisocial'){
        const co = S.companies.find(c=>c.id===tp.coId && c.active);
        if (co && !co.creditChecked){
          S.companies.forEach(c=>{ if (c.active) c.order = Math.round(c.order*0.85); });
          queuePrompt('antisocialPenalty', { name: co.name });
          co.active = false; co.order = 0;
        }
        tp.done = true;
      } else if (tp.kind === 'notedrawer'){
        const co = S.companies.find(c=>c.id===tp.coId && c.active);
        const amt = co ? S.receivables.filter(r=>r.coId===co.id && !r.settled && r.kind==='note').reduce((a,r)=>a+r.amount,0) : 0;
        if (co && amt > 0) queuePrompt('noteDrawer', { coId: co.id, name: co.name, amount: amt });
        tp.done = true;
      }
    }
    // 罠の破裂
    if (tp.burstTurn && S.turn === tp.burstTurn){
      if (tp.kind === 'fraud'){
        const co = S.companies.find(c=>c.id===tp.coId && c.active);
        if (co && outstanding(co) > 0){
          enterLegal(co, '事業停止'); co.resolveTurn = S.turn + 1;
          log('★ ' + co.name + ' と連絡が取れなくなった。事務所はもぬけの殻である。','bad');
        }
      } else if (tp.kind === 'circular'){
        const co = S.companies.find(c=>c.id===tp.coId && c.active);
        if (co){
          enterLegal(co, '連鎖の破綻'); co.resolveTurn = S.turn + 1;
          S.reputationPenalty = 1;
          log('★ 循環が破綻した。伝票を通していた取引は架空であり、売掛金は回収できない。加えて信用が失墜し、全取引先の交渉余地が1減った。','bad');
        }
      }
      tp.burstTurn = null;
    }
  }
}

/** 仕入原価の上昇。上昇分の4割は自然に売価へ乗るが、残りは価格転嫁を交渉しないと粗利が消える */
function raiseCost(up, msg){
  const cap = 1.35;
  const before = S.costIdx;
  S.costIdx = Math.min(cap, S.costIdx * (1+up));
  const eff = S.costIdx/before - 1;
  S.companies.forEach(c=>{ c.priceIdx *= (1 + eff*0.5); });
  log(msg + '（+' + pct(eff,0) + '／原価指数 ' + (S.costIdx*100).toFixed(0) +
      '）。半分は自然に売価へ乗ったが、残りは価格転嫁を交渉しないと粗利が消える。','warn');
}

/* ---- ランダムイベント（§7.2） ---- */
function phaseRandomEvents(rep){
  const R = CFG.rnd;
  for (const co of S.companies){
    if (!co.active || co.status !== 'normal') continue;
    if (co.orderDown){ if (chance(R.orderRecover)){ co.order = co.baseOrder; co.orderDown = false;
      log(co.name + ' の発注が元の水準に戻った。','good'); } }
    else if (chance(R.orderDown)){
      const d = 0.10 + rnd()*0.20;
      co.order = Math.round(co.order * (1-d)); co.orderDown = true;
      log(co.name + ' の発注が ' + pct(d,0) + ' 減った。放っておくと売上は削れていく。','warn');
    }
    if (chance(R.termsChange)){
      queuePrompt('termsChange', { coId: co.id });
    }
  }
  if (chance(R.bigOrder)){
    const co = pickCo();
    if (co){
      const amt = ri(200, 600);
      if (S.inventory >= amt * (1-marginOf(co))){
        S.inventory -= amt * (1-marginOf(co));
        S.receivables.push({ id:'b'+S.turn, coId:co.id, amount:amt, kind:'ar', dueTurn:S.turn+dueOffset(co.terms), born:S.turn, settled:false });
        rep.sales += amt; rep.gross += amt*marginOf(co); S.stats.sales += amt; S.yearSales += amt;
        log('◎ ' + co.name + ' から「今週中に欲しい」という突発の大口注文（' + man(amt) + '）。在庫があったので受けられた。','good');
      } else {
        log('✕ ' + co.name + ' から突発の大口注文（' + man(amt) + '）。在庫がなく失注した。','warn');
        giveCard('inventory-is-cash');
      }
    }
  }
  const invCap = expectedCogs() * 0.9;
  if (S.inventory > invCap && chance(R.spoil)){
    const loss = S.inventory * (0.05 + rnd()*0.10);
    S.inventory -= loss; S.equity -= loss; rep.spoil = loss;
    log('在庫が積み上がり、賞味期限切れで ' + man(loss) + ' を廃棄した。在庫は現金が形を変えたものである。','bad');
    giveCard('inventory-is-cash');
  }
  if (chance(R.costUp)) raiseCost(0.04 + rnd()*0.06, '仕入価格が上昇した');
  if (S.turn >= 25 && S.flags.paperNoteEnd){
    const cand = S.companies.filter(c=>c.active && c.status==='normal' && (c.terms.noteRatio||0)>0 && !c.refusesDenki);
    if (cand.length && chance(0.5)){
      const co = pick(cand); co.refusesDenki = true; co.denkiDeadline = S.turn + 2;
      queuePrompt('denkiRefuse', { name: co.name, coId: co.id });
    }
  }
  for (const co of S.companies){
    if (co.refusesDenki && co.denkiDeadline && S.turn >= co.denkiDeadline){

  // 訴訟の完了

      co.title = true; co.lawsuitTurn = null;

}

function cashForecast(){
  const rows = [];
  // これから出荷する分も織り込む。現存する売掛だけを並べると、毎ターン嘘の資金ショート予測が出る。
  const plan = S.companies.filter(c=>c.active && c.status==='normal' && !c.prepay).map(c=>({
    ship: Math.min(c.order, c.limit/effectiveMonths(c.terms)),
    due: dueOffset(c.terms), note: noteOffset(c.terms), nr: (S.flags.paperNoteEnd ? 0 : (c.terms.noteRatio||0)),
  }));
  const prepay = S.companies.filter(c=>c.active && c.prepay).reduce((a,c)=>a+c.order,0);
  for (let t = S.turn; t < S.turn + 4; t++){
    let sure = 0, unsure = 0;
    for (const r of S.receivables){
      if (r.settled) continue;
      const co = findCo(r.coId); if (!co) continue;
      const when = r.kind === 'note' ? r.cashTurn : r.dueTurn;
      const hit = (t === S.turn) ? (when <= t) : (when === t);
      if (!hit) continue;
      if (co.status === 'normal') sure += r.amount * (r.kind==='ar' ? (1-(co.terms.noteRatio||0)) : 1);
      else unsure += r.amount;
    }
    for (const p of plan){                       // 今ターン以降の出荷から生じる入金
      const shipTurn = t - p.due;
      if (shipTurn >= S.turn && shipTurn <= S.turn + 3) sure += p.ship * (1 - p.nr);
      const noteShip = t - p.due - p.note;
      if (p.nr > 0 && noteShip >= S.turn && noteShip <= S.turn + 3) sure += p.ship * p.nr;
    }
    sure += prepay;
    let out = S.payables.filter(p=>p.turn===t).reduce((a,p)=>a+p.amount,0);
    if (t > S.turn) out += expectedCogs();        // 当月に発注する分の支払は翌月末
    out += S.fixedCost + S.employees*CFG.employeeCost;
    out += S.loans.reduce((a,l)=>a + (l.left>0 ? l.monthly + l.left*l.rate/12 : 0), 0);
    rows.push({ t, sure, unsure, out });
  }
  return rows;
}

    <span class="muted">（在庫は現金ではない。この数字が大きいほど現金が少ない）</span></div>
    <div class="scroll"><table><thead><tr><th>ターン</th><th class="num">■確定の入金</th><th class="num">▨未確定（遅延中）</th>
    <th class="num">支払予定</th><th class="num">差引</th><th class="num">現金残高の予測</th></tr></thead><tbody>`;
  for (const r of rows){
    const diff = r.sure - r.out; cash += diff;
    h += `<tr><td>${r.t}${r.t===S.turn?'(今)':''}</td>
      <td class="num">${fmt(r.sure)}</td>
      <td class="num ${r.unsure>0?'warn':''}">${fmt(r.unsure)}</td>
      <td class="num">-${fmt(r.out)}</td>
      <td class="num ${diff<0?'bad':''}">${fmt(diff)}</td>
      <td class="num ${cash<0?'bad':cash<500?'warn':''}">${fmt(cash)}${cash<0?' ← 資金ショート予測':''}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  if (!unlocked('finance')) return h + `<div class="small muted" style="margin-top:8px">ファクタリング・手形割引・借入は第${CFG.unlock.finance}ターンから使える。</div>`;

  h += `<div class="hr"></div><h3>手当ての選択肢</h3>
    <div class="small muted">ファクタリング手数料10%は、粗利率16%に対して<b>粗利の6割超</b>を吹き飛ばす。安易に使わないこと。
    ⏰ 手数料は債権の残存サイトが長いほど安い ―― 早く動くほど安く済む。</div>`;
  const fl = factorableList().sort((a,b)=>b.amount-a.amount).slice(0,6);
  h += `<div class="scroll"><table><thead><tr><th>売掛債権</th><th class="num">金額</th><th class="num">入金予定</th>
    <th class="num">手数料</th><th class="num">受取額</th><th></th></tr></thead><tbody>`;
  for (const r of fl){
    const co = findCo(r.coId); const fee = factoringFee(r);
    h += `<tr><td>${esc(co?co.name:'')}</td><td class="num">${fmt(r.amount)}</td><td class="num">第${r.dueTurn}T</td>
      <td class="num ${fee>=0.12?'bad':''}">${pct(fee,0)}</td><td class="num">${fmt(r.amount*(1-fee))}</td>
      <td><button class="tiny" onclick="ui.factor('${r.id}')" ${slotsLeft()<=0?'disabled':''}>譲渡する</button></td></tr>`;
  }
  const notes = S.receivables.filter(r=>!r.settled && r.kind==='note');
  for (const r of notes.slice(0,4)){
    const co = findCo(r.coId); const remain = Math.max(0, r.cashTurn - S.turn); const fee = 0.005+0.01*remain;
    h += `<tr><td>${esc(co?co.name:'')} <span class="chip">手形</span></td><td class="num">${fmt(r.amount)}</td>
      <td class="num">第${r.cashTurn}T</td><td class="num">${pct(fee,1)}</td><td class="num">${fmt(r.amount*(1-fee))}</td>
      <td><button class="tiny" onclick="ui.discount('${r.id}')" ${slotsLeft()<=0?'disabled':''}>割引する</button></td></tr>`;
  }
  h += `</tbody></table></div>
    <div class="row" style="margin-top:8px">
      <button class="tiny" onclick="ui.loan(1000)" ${slotsLeft()<=0?'disabled':''}>1,000万円を借り入れる（年3%・24回）</button>
      <span class="small muted">返済が毎月の固定的な負担になる</span></div>`;
  return h;
}

/* =========================================================================
   モーダル
   ========================================================================= */
function modal(inner, wide){
  return `<div class="modal-bg"><div class="modal" style="${wide?'max-width:920px':''}">${inner}</div></div>`;
}
function renderModal(){
  const root = $('modalRoot');
  let html = '';
  if (S.gameOver) html = modalGameOver();
  else if (S.ending) html = modalEnding();
  else if (S.pendingClosing) html = modalClosing();
  else if (S.promptQueue && S.promptQueue.length) html = modalPrompt(S.promptQueue[0]);
  else if (S.cardQueue && S.cardQueue.length) html = modalCard(S.cardQueue[0]);
  else if (V.modal) html = modalCustom(V.modal);
  root.innerHTML = html;
}
function modalPrompt(q){
  const P = PROMPTS[q.id];
  if (!P){ S.promptQueue.shift(); return ''; }
  const title = typeof P.title === 'function' ? P.title(q.p) : P.title;
  const body = typeof P.body === 'function' ? P.body(q.p) : P.body;
  let h = `<h2>${esc(title)}</h2><div style="margin:10px 0">${body}</div>`;
  h += P.options.map((o,i)=>`<div class="opt" onclick="ui.prompt(${i})"><b>${esc(o.label)}</b>
    ${o.note?`<div class="small muted">${esc(o.note)}</div>`:''}</div>`).join('');
  return modal(h);
}
function modalCard(id){
  const c = CARDS.find(x=>x.id===id);
  let h = `<div class="small muted">解説カードを獲得した（${c.cat}・${c.tier}）</div>
    <h2 style="margin-top:6px">${esc(c.title)}</h2>
    <div style="margin:10px 0">${esc(c.body)}</div>
    ${c.src?`<div class="s small muted">出典: ${esc(c.src)}</div>`:''}
    <div class="center" style="margin-top:12px"><button class="primary" onclick="ui.cardOk()">閉じる</button></div>`;
  return modal(h);
}
function modalCustom(m){
  if (m.kind === 'credit') return modalCredit(m);
  if (m.kind === 'collect') return modalCollect(m);
  if (m.kind === 'manage') return modalManage(m);
  if (m.kind === 'renego') return modalRenego(m);
  if (m.kind === 'report') return modalReport(m);
  if (m.kind === 'legacy') return modalLegacy();
  if (m.kind === 'msg') return modal(`<h2>${esc(m.title)}</h2><div>${m.body}</div>
    <div class="center" style="margin-top:12px"><button class="primary" onclick="ui.close()">閉じる</button></div>`);
  return '';
}

/* ---- §9.3 与信判断ダイアログ ---- */
function dlgRoomText(co){
  if (co.roomRange) return `${co.roomRange[0]}〜${co.roomRange[1]}（信用調査による推定）`;
  if (co.roomLower !== null && co.roomLower !== undefined) return `${co.roomLower} 以上（登記確認による推定）`;
  return '不明（登記確認で下限、信用調査でレンジが分かる。結果は翌ターン）';
}
function shipHintHtml(co, limit){
  const am = arMonths(co.terms), em = effectiveMonths(co.terms);
  const a = limit/am, b = limit/em;
  let h = `<div class="small">現金払いなら（${am.toFixed(1)}ヶ月） → 月 <b>${fmt(a)}万円</b>まで出荷できます</div>`;
  if (em > am + 0.01){
    h += `<div class="small">一部手形込み（${em.toFixed(1)}ヶ月） → 月 <b>${fmt(b)}万円</b>まで
      （希望額 ${fmt(co.order)}万の ${pct(b/co.order,0)}）<span class="warn">← 実際はこちら</span></div>`;
  } else {
    h += `<div class="small muted">希望額 ${fmt(co.order)}万の ${pct(b/co.order,0)} まで出荷できます</div>`;
  }
  const naive = S.equity * ({ '最上位':0.10,'上位':0.06,'中位':0.04,'下位':0.02,'要注意':0.01 }[ratingOf(co).key] || 0.01);
  h += `<div class="tiny muted">参考: 教科書の自己資本比の目安なら ${fmt(naive)}万円（この目安を素朴に当てると商売が止まる ― 用語帳）</div>`;
  return h;
}
function modalCredit(m){
  const co = findCo(m.coId); if (!co) return '';
  const d = V.dlg;
  const cap = perCompanyCap(co), free = frameFree(), req = requiredLimit(co);
  const maxLimit = Math.min(cap, free);
  const reqPt = d.sg.reduce((a,k)=>a+CFG.safeguards.find(s=>s.key===k).pt, 0);
  const room = currentRoom(co, true) + d.conc.length;
  let h = `<h2>与信判断: ${esc(co.name)}（${INDUSTRIES[co.industry].label}）</h2>
  <table><tbody>
    <tr><td>希望取引額</td><td class="num">月 ${fmt(co.order)}万円</td></tr>
    <tr><td>支払条件</td><td>${esc(termsLabel(co.terms))}</td></tr>
    <tr><td>支払サイト</td><td class="mono">${siteFormula(co.terms)}${effectiveMonths(co.terms)>arMonths(co.terms)?
      `<br>手形分を含む実効サイト（加重平均） <b>${effectiveMonths(co.terms).toFixed(2)}ヶ月</b>
       ／ 手形分の現金化は最長 <b>${siteDays(co.terms)+(co.terms.noteDays||0)}日</b> ⚠`:''}</td></tr>
    <tr><td>信用スコア</td><td>${co.score===null?'なし（決算書の開示なし）':co.score} → 格付「${ratingOf(co).key}」／1社上限 ${man(cap)}（総枠の${pct(ratingOf(co).pct,0)}）</td></tr>
    <tr><td>仕入先を兼ねる</td><td>${co.isSupplier?'はい（相殺が使えます）':'いいえ（相殺は使えません）'}</td></tr>
    ${co.registryChecked?`<tr><td>登記</td><td class="small">${co.registryFlags.map(esc).join('／')}</td></tr>`:''}
  </tbody></table>
  <div class="calc">参考: 与信限度額の目安
  必要限度 = ${fmt(co.order)}万 × ${arMonths(co.terms).toFixed(2)}ヶ月${(co.terms.noteRatio||0)>0?` + ${fmt(co.order)}万 × ${co.terms.noteRatio} × ${((co.terms.noteDays||0)/30).toFixed(2)}ヶ月`:''} = ${fmt(req)}万円
  格付上限 = 総与信枠 ${fmt(totalFrame())}万 × ${pct(ratingOf(co).pct,0)}(${ratingOf(co).key}) = ${fmt(cap)}万円
  総枠の残り = ${fmt(free)}万円
  → ${fmt(Math.min(req,maxLimit))}万円が上限（${req<maxLimit?'必要限度':(cap<free?'格付上限':'総枠の残り')}が最小）</div>`;

  h += `<div class="opt sel" style="margin-top:10px"><b>● 掛で売る</b>　与信限度額
    <input type="number" id="limIn" value="${d.limit}" min="0" max="${Math.max(0,maxLimit)}" step="10"
      oninput="ui.dlgLimit(this.value)"> 万円
    <span class="tiny muted">（上限 ${fmt(Math.max(0,maxLimit))}）</span>
    <div id="shipHint" style="margin-top:4px">${shipHintHtml(co, d.limit)}</div></div>`;

  h += `<div class="opt"><b>併せて交渉する保全</b>　交渉余地: ${esc(dlgRoomText(co))}
    <div style="margin-top:6px">`;
  for (const sg of CFG.safeguards){
    const av = safeguardAvailable(sg);
    h += `<label class="${av?'':'locked'}" style="display:block">
      <input type="checkbox" ${d.sg.includes(sg.key)?'checked':''} ${av?'':'disabled'}
        onchange="ui.dlgSg('${sg.key}')"> ${sg.label} <span class="chip">${sg.pt}pt</span>
      ${av?'':`<span class="tiny muted">第${sg.tier==='light'?CFG.unlock.safeguardLight:CFG.unlock.safeguardHeavy}ターンから</span>`}
      ${sg.key==='guarantor'&&d.sg.includes('guarantor')?`　極度額 <input type="number" value="${d.cap}" oninput="ui.dlgCap(this.value)"> 万円`:''}
      </label>`;
  }
  h += `<div class="small" style="margin-top:4px">要求合計 <b>${reqPt}pt</b></div></div>`;

  h += `<div class="opt"><b>差し出すもの（余地を広げる）</b><div style="margin-top:6px">`;
  for (const c of CFG.concessions){
    h += `<label style="display:block"><input type="checkbox" ${d.conc.includes(c.key)?'checked':''}
      onchange="ui.dlgConc('${c.key}')"> ${c.label} <span class="chip">+1</span>
      <span class="tiny muted">${c.note}</span></label>`;
  }
  h += `<div class="small" style="margin-top:4px">調整後の余地 <b>${room}</b>
    ${reqPt<=room?'<span class="good">→ 成立見込み</span>':reqPt===room+1?'<span class="warn">→ 相手から対案が返るかもしれない</span>':'<span class="bad">→ 失注の見込み</span>'}
    <span class="tiny muted">（余地の実数は隠しパラメータ。表示は推定である）</span></div></div>`;

  if (d.counter){
    h += `<div class="panel sub"><b>相手からの対案</b>: ${d.counter.map(sgLabel).join('・')} なら受ける、という返答があった。
      <div class="row" style="margin-top:6px">
        <button class="primary tiny" onclick="ui.dlgAcceptCounter()">対案を受け入れて契約する</button>
        <button class="tiny" onclick="ui.dlgDropCounter()">受け入れない</button></div></div>`;
  }

  h += `<div class="spread" style="margin-top:12px">
    <div class="row">
      <button onclick="ui.dlgCash()">現金・前払いを要求（失注リスク 40%）</button>
      <button onclick="ui.dlgRefuse()">断る</button></div>
    <div class="row">
      <button onclick="ui.close()">キャンセル</button>
      <button class="primary" onclick="ui.dlgAccept()">決定</button></div></div>`;
  return modal(h, true);
}

/* ---- §9.5 回収アクション画面 ---- */
function baseRateText(co){
  if (co.trap==='fraud'||co.trap==='circular') return '0%（この類型では回収手段が効かない）';
  const keys = ['collateral','guarantor','notarial','retention','eol'];
  for (const k of keys){
    if (co.safeguards[k]){
      const r = CFG.baseRecovery[k];
      return pct(r[0],0) + '〜' + pct(r[1],0) + '（' + sgLabel(k) + '）';
    }
  }
  return '0%〜10%（保全なし）';
}
function modalCollect(m){

  const st = { delay:'遅延', longdelay:'長期遅延 '+co.delayTurns+'ヶ月目', legal:(co.legalKind||'法的整理'), normal:'正常' }[co.status];
  let h = `<h2>回収: ${esc(co.name)}（${INDUSTRIES[co.industry].label}）</h2>
    <div class="small">売掛 <b>${man(outstanding(co))}</b>　${st}

      ／ 納品物: ${!co.stock?'なし':stockAlive(co)?`<span class="good">残っている（第${co.stock.resaleTurn}ターンに転売される）</span>`:`<span class="bad">第${co.stock.resaleTurn}ターンに転売済み</span>`}</div>
    <div class="small">基準回収率 <b>${baseRateText(co)}</b>
      ${co.recoveryBonus?`＋ これまでの回収アクション <b>${pct(co.recoveryBonus,0)}</b>`:''}</div>

    <button class="tiny" onclick="ui.onsite(${co.id})" ${slotsLeft()<=0?'disabled':''}>現物を確認する</button>
    <button class="tiny" onclick="ui.renego(${co.id})" ${slotsLeft()<=0?'disabled':''}>保全条件を追加交渉する</button>
    <button class="tiny" onclick="ui.passthru(${co.id})" ${slotsLeft()<=0?'disabled':''}>価格転嫁を交渉する</button>
    ${co.refusesDenki?`<button class="tiny primary" onclick="ui.denki(${co.id})" ${slotsLeft()<=0?'disabled':''}>電子記録債権への移行を交渉する</button>`:''}
    <button class="tiny ${co.isSupplier?'primary':''}" onclick="ui.toggleSup(${co.id})">仕入先に${co.isSupplier?'指定中':'指定する'}</button>
    ${inTrouble(co)?`<button class="tiny primary" onclick="ui.collect(${co.id})">回収画面</button>`:''}
    <button class="tiny danger" onclick="ui.stopTrade(${co.id})">取引を止める</button>
    </div></div>
    <div class="center" style="margin-top:10px"><button onclick="ui.close()">閉じる</button></div>`;
  return modal(h, true);
}

function modalRenego(m){
  const co = findCo(m.coId); if (!co) return '';
  const d = V.dlg;
  const reqPt = d.sg.reduce((a,k)=>a+CFG.safeguards.find(s=>s.key===k).pt,0);
  const room = currentRoom(co,false) + d.conc.length;
  let h = `<h2>保全条件の追加交渉: ${esc(co.name)}</h2>
    <div class="small">取引開始後の交渉余地は「初期値 −1」、スコアが落ちた後は1に固定、遅延が起きた後は0になる。
      現在の推定: ${esc(dlgRoomText(co))} → 調整後 <b>${room}</b></div><div class="hr"></div>`;
  for (const sg of CFG.safeguards){
    const av = safeguardAvailable(sg), has = !!co.safeguards[sg.key];
    h += `<label class="${av&&!has?'':'locked'}" style="display:block">
      <input type="checkbox" ${d.sg.includes(sg.key)?'checked':''} ${(av&&!has)?'':'disabled'} onchange="ui.dlgSg('${sg.key}')">
      ${sg.label} <span class="chip">${sg.pt}pt</span>${has?' <span class="chip good">取得済み</span>':''}
      ${av?'':`<span class="tiny muted">第${sg.tier==='light'?CFG.unlock.safeguardLight:CFG.unlock.safeguardHeavy}ターンから</span>`}
      ${sg.key==='guarantor'&&d.sg.includes('guarantor')?`　極度額 <input type="number" value="${d.cap}" oninput="ui.dlgCap(this.value)"> 万円`:''}</label>`;
  }
  h += `<div class="small">要求合計 ${reqPt}pt</div><div class="hr"></div><b>差し出すもの</b>`;
  for (const c of CFG.concessions){
    h += `<label style="display:block"><input type="checkbox" ${d.conc.includes(c.key)?'checked':''} onchange="ui.dlgConc('${c.key}')">
      ${c.label} <span class="chip">+1</span> <span class="tiny muted">${c.note}</span></label>`;
  }
  h += `<div class="spread" style="margin-top:12px"><button onclick="ui.close()">キャンセル</button>
    <button class="primary" onclick="ui.doRenego(${co.id})">交渉する（アクション枠1）</button></div>`;
  return modal(h, true);
}

  const L = S.legacy;

    <div>権利を行使できると知った時から5年で、債権は消滅する（民法166条）。この債権は<b>第${L.deadline}ターンに時効を迎える</b>。<br><br>
    <b>催告は延命、承認は更新。</b>内容証明で催告すれば、そこから6ヶ月間は時効が完成しない（150条）。相手が債務を承認すれば、時効は振り出しに戻る（152条）。</div>
    <div class="opt" onclick="ui.legacyDo('mail')"><b>内容証明で催告する</b>（アクション枠1・${man(CFG.cost.contentsMail)}）
      <div class="small muted">時効の完成が6ヶ月猶予される（延命）</div></div>

    <div class="center" style="margin-top:10px"><button onclick="ui.close()">閉じる</button></div>`;

function modalClosing(){
  const C = S.pendingClosing;
  const yr = CFG.closingTurns.indexOf(C.turn)+1;
  let h = `<h2>第${yr}期 決算（第${C.turn}ターン）</h2>
    <div class="small">営業利益 ${man(C.op)}／当期売上 ${man(C.sales)}</div>
    <div class="hr"></div><b>貸倒損失の計上</b>
    <div class="small muted">計上すれば納税額が減って現金が残るが、回収を諦める意思表示でもある。納税額 = max(0, 営業利益 − 貸倒計上額) × 30%。</div>`;
  if (!C.candidates.length) h += `<div class="small muted">計上できる焦げ付きはない。</div>`;
  for (const c of C.candidates){
    h += `<label style="display:block"><input type="checkbox" class="woChk" value="${c.id}" checked> ${esc(c.name)} ${man(c.amount)}</label>`;
  }
  // §8.3 期末の3行振り返り
  const use = S.stats.frameUseCnt ? S.stats.frameUseSum/S.stats.frameUseCnt : 0;
  const list = S.companies.filter(c=>c.active);
  const tot = list.reduce((a,c)=>a+c.order,0)||1;
  const top = list.slice().sort((a,b)=>b.order-a.order)[0];
  h += `<div class="hr"></div><div class="calc">今期あなたが取った保全: ${S.stats.safeguardsTaken}件 ／ 取り逃した機会: ${S.stats.safeguardMissed}件
焦げ付き純損失: ${man(S.stats.badDebtNet)}（累計売上の ${pct(badDebtRate(),2)}）
総与信枠の平均使用率: ${pct(use,0)} ／ うち上位1社に ${top?pct(top.order/tot,0):'—'}
断った取引の累計額: 月${fmt(S.stats.refused)}万円分</div>
    <div class="center" style="margin-top:12px"><button class="primary" onclick="ui.closing()">決算を確定する</button></div>`;
  return modal(h, true);
}

function modalGameOver(){
  const g = S.gameOver;
  let h = `<h2 class="bad">倒産 ―― 第${g.turn}ターン（${ym(g.turn)}）</h2>
    <div>現金が ${man(g.cash)} となり、支払いができなくなった。<b>${g.kind}</b>である。</div>
    <div class="calc">累計売上 ${fmt(S.stats.sales)}万円
焦げ付き純損失 ${fmt(S.stats.badDebtNet)}万円
自己資本 ${fmt(S.equity)}万円 ／ 在庫 ${fmt(S.inventory)}万円（現金ではない）
${g.kind==='黒字倒産'?'損益計算書は黒字だった。利益と現金は別物である。回収サイトと支払サイトのズレ、手形、在庫 ―― どれが効いたかを振り返ること。':'赤字が続いた。粗利率16%の商売では、原価の上昇を転嫁できないだけで利益は消える。'}</div>
    <div class="center" style="margin-top:12px"><button class="primary" onclick="ui.reset()">最初からやり直す</button></div>`;

function modalEnding(){
  const e = S.ending;
  let h = `<h2>${e.grade.key==='優'?'🏆':'🎉'} 第36ターン到達 ―― 評価「${e.grade.key}」${esc(e.grade.title)}</h2>
    <div class="calc">焦げ付き純損失 ${fmt(e.net)}万円（累計売上 ${fmt(S.stats.sales)}万円の ${pct(e.rate,2)}）
現金 ${fmt(e.cash)}万円 ／ 自己資本 ${fmt(e.equity)}万円（勝敗の判定には使わない）
用語帳 ${cardCount()}/${CARDS.length}（勝利条件には含めない。独立した達成である）</div>`;

  h += `<h3 style="margin-top:10px">各債権について「取引開始時に何を取っていたか」と「結果」</h3>`;
  if (!S.resolutions.length) h += `<div class="small good">焦げ付いた債権はなかった。</div>`;
  else {
    h += `<div class="scroll"><table><thead><tr><th>取引先</th><th>取っていた保全</th><th class="num">債権</th>
      <th class="num">回収</th><th class="num">焦げ付き</th><th>適用された基準</th></tr></thead><tbody>`;
    for (const r of S.resolutions){
      h += `<tr><td>${esc(r.name)}</td><td class="small">${r.safeguards.length?r.safeguards.map(sgLabel).join('・'):'<span class="warn">なし</span>'}</td>
        <td class="num">${fmt(r.total)}</td><td class="num good">${fmt(r.recovered)}</td>
        <td class="num bad">${fmt(r.loss)}</td><td class="small">${esc(r.base)}</td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  h += `<h3 style="margin-top:10px">回避した損失／過剰な慎重さのコスト</h3>
    <div class="small">断った・調べて売らなかったことで回避した損失: <b class="good">${man(S.stats.avoidedLoss)}</b>
      <span class="muted">（何も起きなかったことが成果である）</span></div>
    <div class="small">断ったが健全だった相手の取引額: <b class="warn">月${fmt(S.stats.refusedHealthy)}万円分</b>
      <span class="muted">（過剰な慎重さにもコストがある）</span></div>`;

  const unused = COLLECT_ACTIONS.filter(a=>!S.stats.actionsUsed[a.key]);
  h += `<h3 style="margin-top:10px">一度も使わなかった回収手段</h3><ul class="tight small">`;
  for (const a of unused) h += `<li>${esc(a.label)} ― 使える状況を作るには: ${esc(a.effect)}</li>`;
  h += `</ul>`;

  const missing = CARDS.filter(c=>!S.cards[c.id]);
  h += `<h3>獲得できなかったカード（${missing.length}枚）</h3><div class="small muted">${missing.map(c=>esc(c.title)).join('／')||'すべて獲得した'}</div>`;

  const tips = [];
  if (S.stats.safeguardsTaken < 3) tips.push('保全を取る回数が少なかった。新規契約のときが最も安く取れる ― 遅延が起きた後は交渉余地が0になる。');
  if (S.stats.badDebtNet > CFG.win.excellentAmt) tips.push('焦げ付きの多くは、保全を取っていない相手で起きた。基準回収率0〜10%と70〜95%の差がそのまま損失になる。');
  if (!S.stats.actionsUsed.offset) tips.push('相殺を一度も使わなかった。危ない売り先を仕入先にも指定しておけば、買掛金の範囲は確実に回収できた（仕入価格は3%高くなる）。');
  if (S.stats.refusedHealthy > 1000) tips.push('断った相手の中に健全な会社が多かった。調査は「断る理由を探す作業」ではなく「兆候の意味を切り分ける判断」である。');
  if (S.employees === 0) tips.push('人を増やさなかった。アクション枠3では、調べる相手も回収する相手も選べない。枠は固定費で買える。');
  while (tips.length < 3) tips.push('総与信枠の配分はゼロサムである。発注が減った取引先から枠を剥がして、次の1社に回すこと。');
  h += `<h3>次はこうしてみよう</h3><ul class="tight small">${tips.slice(0,3).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  h += `<div class="center" style="margin-top:12px"><button class="primary" onclick="ui.reset()">もう一度（罠の種類・対象・時期は変わる）</button></div>`;
  return modal(h, true);
}
function modalReport(){ return ''; }

/* =========================================================================
   操作
   ========================================================================= */
const WHY_CARD = {
  offset:'offset', repossess:'safeguard-timing', lien:'movables-lien',
  claimGuarantor:'guaranty-max', enforceCollateral:'safeguard-timing',
  seizure:'notarial-deed', proof:'bankruptcy-priority', notarialNow:'notarial-deed',
  mail:'dunning-vs-demand', plan:'prescription', lawsuit:'seizure', dun:'dunning-vs-demand',
};

const ui = {
  tab(k){ V.tab = k; render(); },
  close(){ V.modal = null; V.dlg = null; render(); },
  theme(){
    const el = document.documentElement;
    const cur = el.getAttribute('data-theme');
    el.setAttribute('data-theme', cur === 'dark' ? 'light' : cur === 'light' ? 'auto' : 'dark');
    try { localStorage.setItem('kakeuri.theme', el.getAttribute('data-theme')); } catch(e){}
  },
  prompt(i){
    const q = S.promptQueue.shift();
    const P = PROMPTS[q.id];
    try { P.options[i].run(q.p); } catch(e){ console.error(e); }
    render();
  },
  cardOk(){ S.cardQueue.shift(); render(); },

  /* --- 引合い --- */
  credit(id){
    const co = findCo(id); if (!co) return;
    const cap = perCompanyCap(co), free = frameFree();
    const suggest = Math.min(Math.round(requiredLimit(co)/10)*10, cap, free);
    V.dlg = { limit: Math.max(0, suggest), sg:[], conc:[], cap:'', counter:null };
    V.modal = { kind:'credit', coId:id };
    if (!S.cards['equity-textbook']) giveCard('equity-textbook');   // §6.4 第1ターンの最初の限度額入力で出す
    render();
  },
  dlgLimit(v){
    V.dlg.limit = Math.max(0, Math.round(Number(v)||0));
    const co = findCo(V.modal.coId);
    const el = $('shipHint'); if (el && co) el.innerHTML = shipHintHtml(co, V.dlg.limit);
  },
  dlgSg(k){
    const d = V.dlg;
    d.sg = d.sg.includes(k) ? d.sg.filter(x=>x!==k) : d.sg.concat([k]);
    d.counter = null; render();
  },
  dlgConc(k){
    const d = V.dlg;
    d.conc = d.conc.includes(k) ? d.conc.filter(x=>x!==k) : d.conc.concat([k]);
    d.counter = null; render();
  },
  dlgCap(v){ V.dlg.cap = v; },
  dlgAccept(){
    const co = findCo(V.modal.coId); const d = V.dlg;
    const cap = perCompanyCap(co), free = frameFree();
    if (d.limit > Math.min(cap, free)){
      alert('限度額が上限を超えています。格付上限 ' + man(cap) + '／総枠の残り ' + man(free) +
            '\n新規に枠を割り当てたいときは、取引先一覧で既存の限度額を減らして枠を空けてください。');
      return;
    }
    if (d.sg.includes('guarantor') && !d.cap) giveCard('guaranty-max');   // 極度額を空欄のまま進める（警告は出さない）
    const res = acceptLead(co, d.limit, d.sg, d.conc, Number(d.cap)||null);
    if (res && res.counter && res.counter.length){ d.counter = res.counter; render(); return; }
    V.modal = null; V.dlg = null; render();
  },
  dlgAcceptCounter(){
    const co = findCo(V.modal.coId); const d = V.dlg;
    const res = acceptLead(co, d.limit, d.counter, d.conc, Number(d.cap)||null);
    V.modal = null; V.dlg = null; render();
  },
  dlgDropCounter(){ V.dlg.counter = null; render(); },
  dlgCash(){ const co = findCo(V.modal.coId); requestCash(co); V.modal = null; V.dlg = null; render(); },
  dlgRefuse(){ const co = findCo(V.modal.coId); refuseLead(co); V.modal = null; V.dlg = null; render(); },

  /* --- 調査・交渉 --- */
  survey(id, kind){ if (!runSurvey(id, kind)) alert('アクション枠が足りません。'); render(); },
  onsite(id){ if (!runOnsite(id)) alert('アクション枠が足りません。'); render(); },
  passthru(id){ if (!runPassthru(id)) alert('アクション枠が足りません。'); render(); },
  denki(id){ if (!runDenki(id)) alert('アクション枠が足りません。'); render(); },
  toggleSup(id){ toggleSupplier(id); render(); },
  manage(id){ V.modal = { kind:'manage', coId:id }; render(); },
  renego(id){ V.dlg = { sg:[], conc:[], cap:'' }; V.modal = { kind:'renego', coId:id }; render(); },
  doRenego(id){
    const d = V.dlg;
    if (!d.sg.length){ alert('取りたい保全を選んでください。'); return; }
    runRenego(id, d.sg, d.conc, Number(d.cap)||null);
    V.modal = null; V.dlg = null; render();
  },
  setLimit(id){
    const v = Math.max(0, Math.round(Number($('mlim').value)||0));
    const r = setLimit(id, v);
    if (!r.ok) alert(r.msg);
    render();
  },
  stopTrade(id){
    const co = findCo(id); if (!co) return;
    if (!confirm(co.name + ' との取引を止めますか。売掛金の回収は続きますが、以後の出荷は止まります。')) return;
    co.order = 0;
    log(co.name + ' への出荷を止めた。','warn');
    V.modal = null; render();
  },

  /* --- 回収 --- */
  collect(id){ V.modal = { kind:'collect', coId:id }; render(); },
  doCollect(id, key){ if (!runCollectAction(id, key)) alert('アクション枠が足りないか、前提を満たしていません。'); render(); },
  whyCard(key, id){
    const cid = WHY_CARD[key];
    if (cid && !S.cards[cid]) { giveCard(cid); render(); }
  },
  legacy(){ V.modal = { kind:'legacy' }; render(); },
  legacyDo(kind){
    if (slotsLeft() <= 0){ alert('アクション枠が足りません。'); return; }
    useSlot(); if (kind==='mail') spend(CFG.cost.contentsMail);
    legacyAction(kind);
    V.modal = null; render();
  },

  /* --- 資金 --- */
  factor(rid){ if (!runFactoring(rid)) alert('アクション枠が足りません。'); render(); },
  discount(rid){ if (!runDiscountNote(rid)) alert('アクション枠が足りません。'); render(); },
  loan(a){ if (!runLoan(a)) alert('アクション枠が足りません。'); render(); },
  hire(){ if (!runHire()) alert('アクション枠が足りません。'); render(); },
  calc(k,v){ V.calc = V.calc || { closing:30, mo:1, day:30 }; V.calc[k] = Number(v); render(); },
  bulkPrice(){ if (!runBulkPrice()) alert('アクション枠が足りません。'); render(); },
  policy(k){ S.purchasePolicy = k; giveCard('inventory-is-cash'); render(); },
  supplier(k){ S.supplierMode = k; if (k!=='normal') giveCard('supplier-choice'); render(); },

  /* --- ターン --- */
  endTurn(){
    if (S.promptQueue && S.promptQueue.length){ alert('先に案内を読んでください。'); return; }
    endTurn();
    V.modal = null;
    autoSave();
    render();
  },
  closing(){
    const ids = Array.from(document.querySelectorAll('.woChk')).filter(x=>x.checked).map(x=>Number(x.value));
    applyClosing(ids);
    render();
  },

  /* --- セーブ --- */
  save(){ if (saveGame()) alert('保存しました。'); },
  load(){ if (loadGame()){ V.modal = null; V.dlg = null; render(); alert('読み込みました。'); } else alert('保存データがありません。'); },
  reset(){
    if (!confirm('最初からやり直しますか。罠の種類・対象・発火ターンは変わります。')) return;
    newGame(); V.modal = null; V.dlg = null; V.tab = 'home'; autoSave(); render();
  },
};
window.ui = ui;

/* =========================================================================
   保存・読込（1スロット）
   ========================================================================= */
const SAVE_KEY = 'kakeuri.save.v1';
function saveGame(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ S, cid:_cid })); return true; }
  catch(e){ console.error(e); return false; }
}
function autoSave(){ try { saveGame(); } catch(e){} }
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    S = o.S; _cid = o.cid || 0;
    // 乱数列を復元する（シード＋消費回数で再現）
    RNG = mulberry32(S.seed);
    const n = S.rngCount || 0; S.rngCount = 0;
    for (let i=0;i<n;i++) RNG();
    S.rngCount = n;
    return true;
  } catch(e){ console.error(e); return false; }
}

/* =========================================================================
   起動
   ========================================================================= */
(function boot(){
  try {
    const t = localStorage.getItem('kakeuri.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
  if (!loadGame()) newGame();
  render();
})();
</script>
