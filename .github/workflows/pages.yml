name: Deploy to GitHub Pages

# 既定ブランチへの push で https://aki2ba.github.io/kakeuri_game/ に公開する。
#
# 【最初に1回だけ必要な設定】
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
#
# enablement: true を付けているが、Pages サイトが存在しない状態からの「作成」は
# Actions の GITHUB_TOKEN では実行できず（Resource not accessible by integration）、
# 自動では有効化できない。上の設定を1回開くのが唯一の確実な方法である。
# 設定後は enablement: true が既存サイトを確認するだけになり、以後は全自動で公開される。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 設計書 §11「実装後の確認項目」。壊れたものを公開しない
      - name: セルフテスト
        run: node tools/selftest.mjs

      # Pages が未設定なら、ここで「GitHub Actions からのデプロイ」を有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
