name: Deploy to GitHub Pages

# 既定ブランチへの push で https://aki2ba.github.io/kakeuri_game/ に公開する。
#
# configure-pages に enablement: true を渡しているので、Pages が未設定でも
# このワークフロー自身が「GitHub Actions からのデプロイ」を有効化する。
# ただし Pages が使えないプラン・可視性の組み合わせでは有効化できない。
# 非公開リポジトリで Pages を使うには GitHub Pro / Team / Enterprise が要る
# （Free プランなら、リポジトリを公開に切り替えれば使える）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 設計書 §11「実装後の確認項目」。壊れたものを公開しない
      - name: セルフテスト
        run: node tools/selftest.mjs

      # Pages が未設定なら、ここで「GitHub Actions からのデプロイ」を有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
